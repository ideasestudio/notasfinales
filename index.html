<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTAS FINALES SEMESTRE</title>
<style>
  :root{
    --blue:#003698;
    --blue2:#0b56c4;
    --yellow:#ffce00;
    --ink:#17213a;
    --muted:#667085;
    --line:#d9e2f0;
    --bg:#f4f7fb;
    --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit}
  #homeView{min-height:100vh;display:flex;flex-direction:column}
  .hero{background:linear-gradient(135deg,#002f86 0%,#0049bd 68%,#0c5bd1 100%);color:white;padding:34px 24px 74px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;width:310px;height:310px;border-radius:50%;background:rgba(255,206,0,.13);right:-90px;top:-110px}
  .hero:before{content:"";position:absolute;width:170px;height:170px;border:2px solid rgba(255,255,255,.12);border-radius:50%;left:-50px;bottom:-80px}
  .hero-inner{width:min(1120px,100%);margin:auto;position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff3a6;margin-bottom:11px}
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow)}
  h1{margin:0;font-size:clamp(28px,4vw,46px);line-height:1.05;letter-spacing:-.02em}
  .hero p{margin:12px 0 0;max-width:720px;font-size:16px;line-height:1.55;color:#eaf1ff}
  .menu-wrap{width:min(1120px,calc(100% - 32px));margin:-42px auto 40px;position:relative;z-index:2}
  .menu-panel{background:white;border-radius:22px;box-shadow:0 18px 50px rgba(10,43,98,.16);padding:28px;border:1px solid rgba(13,67,151,.06)}
  .menu-title{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:21px}
  .menu-title h2{margin:0;font-size:23px;color:#15223c}
  .menu-title p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .badge{background:#eef4ff;color:var(--blue);font-weight:800;font-size:12px;padding:8px 12px;border-radius:999px;white-space:nowrap}
  .course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .course-card{appearance:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:20px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:104px;transition:.2s ease;position:relative;overflow:hidden}
  .course-card:focus-visible{outline:3px solid rgba(0,54,152,.24);outline-offset:2px}
  .course-card:hover{transform:translateY(-3px);border-color:#a7bde2;box-shadow:0 12px 30px rgba(0,54,152,.10)}
    .icon{width:64px;height:64px;min-width:64px;border-radius:17px;display:grid;place-items:center;background:#eef4ff;color:var(--blue);font-size:29px;font-weight:900}
  .course-card:nth-child(2) .icon{background:#fff4da;color:#9a6100}
  .course-card:nth-child(3) .icon{background:#edf8f1;color:#1f7b45}
  .course-card:nth-child(4) .icon{background:#f4efff;color:#6841b7}
  .course-name{font-size:17px;font-weight:850;line-height:1.22;color:#15223c;margin-bottom:0}
  .course-hint{font-size:13px;line-height:1.4;color:var(--muted)}
  .footnote{text-align:center;color:#77839a;font-size:12px;padding:0 20px 24px;margin-top:auto}

  #courseView{display:none;min-height:100vh;background:#fff}
  .course-topbar{height:68px;background:#fff;border-bottom:1px solid #dce4ef;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px rgba(20,44,86,.05)}
  .back-btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px}
  .back-btn:hover{background:#002c7d}
  .top-title{min-width:0}
  .top-title strong{display:block;font-size:15px;color:#17213a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-title span{display:block;font-size:12px;color:#77839a;margin-top:2px}
  #dashFrame{width:100%;height:calc(100vh - 68px);border:0;display:block;background:#f4f7fb}
  .loader{position:fixed;inset:68px 0 0 0;display:none;place-items:center;background:#f4f7fb;z-index:10;color:#52617a;font-weight:700}
  .spinner{width:30px;height:30px;border:3px solid #dbe5f4;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:760px){
    .hero{padding:28px 18px 66px}
    .menu-wrap{width:min(100% - 20px,1120px);margin-top:-34px}
    .menu-panel{padding:18px;border-radius:18px}
    .menu-title{align-items:flex-start;flex-direction:column}
    .course-grid{grid-template-columns:1fr;gap:12px}
    .course-card{min-height:112px;padding:16px}
    .icon{width:56px;height:56px;min-width:56px;border-radius:15px;font-size:25px}
    .course-name{font-size:16px}
    .course-topbar{height:64px;padding:8px 10px}
    #dashFrame{height:calc(100vh - 64px)}
    .loader{inset:64px 0 0 0}
    .back-btn{padding:9px 11px}
  }
</style>
</head>

<section id="homeView" aria-label="Selección de asignatura">
  <header class="hero">
    <div class="hero-inner">
      <h1>NOTAS FINALES SEMESTRE</h1>
      <p>Seleccione su asignatura</p>
    </div>
  </header>

  <main class="menu-wrap">
    <section class="menu-panel">
      <div class="course-grid">
        <button class="course-card" data-course="logico" type="button">
          <div class="course-name">Experiencias de aprendizaje Lógico-Matemático</div>

        <button class="course-card" data-course="desarrollo" type="button">
          <div class="course-name">Desarrollo Sistémico de las Infancias</div>
        </button>

        <button class="course-card" data-course="voces" type="button">
          <div class="course-name">Voces de las Infancias</div>
        </button>

        <button class="course-card" data-course="transiciones" type="button">
          <div class="course-name">Transiciones Vitales de las Infancias</div>
        </button>
      </div>
    </section>
  </main>
</section>

<section id="courseView" aria-label="Dashboard de asignatura">
  <div class="course-topbar">
    <button class="back-btn" id="backBtn" type="button" aria-label="Volver al menú">← <span>Asignaturas</span></button>
    <div class="top-title">
      <strong id="currentTitle">Asignatura</strong>
      <span>Consulta individual de notas</span>
    </div>
  </div>
  <div class="loader" id="loader"><div><div class="spinner"></div>Cargando dashboard…</div></div>
  <iframe id="dashFrame" title="Dashboard de notas" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
</section>

const titles = {
  logico: 'Experiencias de aprendizaje Lógico-Matemático',
  desarrollo: 'Desarrollo Sistémico de las Infancias',
  voces: 'Voces de las Infancias',
  transiciones: 'Transiciones Vitales de las Infancias'
};
const homeView = document.getElementById('homeView');
const courseView = document.getElementById('courseView');
const frame = document.getElementById('dashFrame');
const currentTitle = document.getElementById('currentTitle');
const loader = document.getElementById('loader');

function decodeUtf8Base64(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function openCourse(key, push=true){
  if(!dashboardData[key]) return;
  currentTitle.textContent = titles[key] || 'Asignatura';
  homeView.style.display='none';
  courseView.style.display='block';
  loader.style.display='grid';
  frame.onload=()=>{ loader.style.display='none'; };
  frame.srcdoc = decodeUtf8Base64(dashboardData[key]);
  if(push) history.pushState({course:key},'', '#'+key);
  window.scrollTo(0,0);
}
function goHome(push=true){
  frame.srcdoc='';
  courseView.style.display='none';
  homeView.style.display='flex';
  loader.style.display='none';
  if(push) history.pushState({},'', location.pathname + location.search);
  window.scrollTo(0,0);
}

document.querySelectorAll('[data-course]').forEach(btn=>{
  btn.addEventListener('click',()=>openCourse(btn.dataset.course));
});
document.getElementById('backBtn').addEventListener('click',()=>goHome());
window.addEventListener('popstate',()=>{
  const key = location.hash.replace('#','');
  if(dashboardData[key]) openCourse(key,false); else goHome(false);
});
const initialKey = location.hash.replace('#','');
if(dashboardData[initialKey]) openCourse(initialKey,false);
</script>
